version: "3.8"

services:
  web-scraper-app:
    container_name: web-scraper
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CHROME_PATH=/usr/bin/chromium
    depends_on:
      - otel-collector
      - promtail
    restart: unless-stopped


  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel_collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317"
      - "4318"
    depends_on:
      - tempo
    restart: unless-stopped


  prometheus:
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infrastructure/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      # - prometheus-data:/prometheus
    ports:
      - "9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo.yaml:ro
    #   - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # environment:
    #   GF_EXPLORE_ENABLED: "true"
    #   GF_AUTH_ANONYMOUS_ENABLED: "true"
    #   GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    #   GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infrastructure/grafana/dashbored:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infrastructure/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infrastructure/promtail/promtail.yaml:/etc/promtail/config.yaml:ro
      - promtail-positions:/run/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  promtail-positions:
