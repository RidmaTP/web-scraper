version: "3.8"

services:
  web-scraper-app:
    container_name: web-scraper
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CHROME_PATH=/usr/bin/chromium
    restart: unless-stopped


  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel_collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317"
      - "4318"
    depends_on:
      - tempo
    restart: unless-stopped


  prometheus:
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infrastructure/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      # - prometheus-data:/prometheus
    ports:
      - "9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo.yaml:ro
    #   - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infrastructure/grafana/dashbored:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

# volumes:
#   tempo-data:
